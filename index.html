<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DLS Champions League</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#ffffff">
<style>
:root{--bg:#fff;--card:#f5f6f8;--tx:#202124;--mut:#5f6368;--dim:#70757a;--bd:#e3e5e8;--blue:#1a56c8;--pill:#e5ecfb;--pillt:#14357f;--chip:#f1f3f4;--in:#f1f3f4;--W:#188038;--D:#80868b;--L:#d93025;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:600px;margin:0 auto;padding:8px 16px 48px}
a:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* header and tabs */
.hd{padding:18px 2px 10px}
.hd[hidden],.chips[hidden]{display:none}
.hd h1{font-size:26px;font-weight:500;margin:0;line-height:1.2}
.logo{display:block;width:min(260px,70%);height:auto;margin:0 auto 4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd{text-align:center}
.sub{font-size:12px;color:var(--mut);margin-top:6px;font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;padding:10px 16px;border-radius:12px;background:var(--chip);color:var(--tx);text-decoration:none;font-size:14px;border:1px solid transparent}
.chips a[aria-current=page]{border-color:#5f6368;background:#eceef1;font-weight:500}
h2.sec{font-size:20px;font-weight:500;margin:20px 0 14px}
.tz{font-size:11px;color:var(--mut);padding:4px 2px 14px;border-bottom:1px solid var(--bd);margin-bottom:8px}

/* match card */
.mc{display:grid;grid-template-columns:1fr 104px;align-items:center;background:var(--card);border-radius:20px;padding:14px 16px 14px 18px;margin-bottom:12px}
.ts{display:grid;gap:14px;padding-right:12px;min-width:0}
.sd{display:grid;grid-template-columns:1fr auto 12px;align-items:center;gap:8px}
.tm{display:flex;align-items:center;gap:12px;min-width:0;color:inherit;text-decoration:none}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{min-width:14px;text-align:right;font-variant-numeric:tabular-nums}
.sd.lo{color:var(--dim)}
.sd.me .nm{font-weight:600}
.mk s{display:block;width:0;height:0;border-style:solid;border-width:4px 6px 4px 0;border-color:transparent var(--tx) transparent transparent}
.st{border-left:1px solid #d6d9de;padding-left:12px;margin:2px 0;align-self:stretch;display:grid;gap:2px;justify-items:center;align-content:center;text-align:center;font-size:12px;color:var(--mut)}
.st b{font-weight:500;color:var(--tx)}
.st small{font-size:11px}
.st u{text-decoration:none;font-weight:600;width:22px;height:22px;line-height:22px;border-radius:50%;color:#fff;margin-top:4px}
.st u.W,.fm b.W,.fc b.W{background:var(--W)}
.st u.D,.fm b.D,.fc b.D{background:var(--D)}
.st u.L,.fm b.L,.fc b.L{background:var(--L)}
.bd{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font-size:9px;font-weight:700;font-style:normal;flex:none}
.more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:var(--pill);color:var(--pillt);border-radius:24px;padding:14px;text-decoration:none;font-weight:500;margin-top:4px}
.more svg{width:16px;height:16px}
.empty{color:var(--mut);font-size:14px;margin:4px 2px 12px}

/* standings */
.box{background:var(--card);border-radius:20px;padding:6px 12px 4px;margin-bottom:12px;--rb:var(--card)}
.tw{overflow-x:auto}
table.lt{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.lt th,.lt td{padding:12px 8px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--bd);background:var(--rb,var(--bg))}
.lt th{font-size:12px;font-weight:500;color:var(--mut);padding:10px 8px}
.lt tbody tr:last-child td{border-bottom:0}
.lt tr[data-team]{cursor:pointer}
.lt .pos{position:sticky;left:0;z-index:1;width:36px;min-width:36px;border-left:4px solid transparent;font-weight:500}
.lt .tcol{position:sticky;left:36px;z-index:1;text-align:left;padding-left:4px}
.lt td.tcol a{display:flex;align-items:center;gap:10px;color:var(--tx);text-decoration:none;font-weight:500}
.lt td.tcol span{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.lt td.p{font-weight:700}
.lt tr.z1 .pos{border-left-color:#1a73e8}
.lt tr.z2 .pos{border-left-color:#e8710a}
.lt tr.z3 .pos{border-left-color:#d93025}
.fm{white-space:nowrap}
.fm b{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;font-size:11px;font-weight:600;color:#fff;margin:0 2px;text-align:center}
.lg{display:flex;gap:6px 14px;flex-wrap:wrap;margin:10px 2px 6px;font-size:12px;color:var(--mut)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* matches tab */
.flt{display:flex;gap:8px;margin:2px 0 6px}
.flt button{border:1px solid transparent;background:var(--chip);border-radius:12px;padding:8px 14px;font-size:14px}
.flt button.on{border-color:#5f6368;background:#eceef1;font-weight:500}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:22px 2px 4px;font-size:15px}
.gh b{font-weight:500}
.gh span{font-size:12px;color:var(--mut)}
.rest{font-size:12px;color:var(--mut);margin:0 2px 10px}

/* team page */
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--tx);padding:14px 4px 8px;font-size:14px;font-weight:500}
.back svg{width:18px;height:18px}
.hero{display:flex;align-items:center;gap:14px;padding:6px 2px 16px}
.hero .bd{width:60px;height:60px;font-size:18px}
.hero h1{font-size:26px;font-weight:500;margin:0;line-height:1.2;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(4,1fr);row-gap:14px;background:var(--card);border-radius:20px;padding:14px 8px;text-align:center}
.stats b{display:block;font-size:18px;font-weight:500}
.stats span{font-size:11px;color:var(--mut)}
.form{background:var(--card);border-radius:20px;padding:16px;display:flex;gap:6px}
.fc{flex:0 0 calc(20% - 5px);display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--mut);min-width:0}
.fc b{width:34px;height:34px;line-height:34px;border-radius:50%;color:#fff;font-size:14px;font-weight:600;text-align:center}
.fc span{color:var(--tx);font-size:12px;font-variant-numeric:tabular-nums}
.fc small{font-size:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.fnote{font-size:12px;color:var(--mut);margin:8px 2px 0}

/* admin */
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;margin:18px 0}
.card h2{font-size:16px;font-weight:500;margin:0 0 10px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:8px}
.names input{width:100%}
.fx{display:grid;grid-template-columns:1fr 46px 12px 46px 1fr;gap:6px;align-items:center;padding:6px 0}
.fx span.h{text-align:right}
.fx span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx input{width:46px;text-align:center;padding:8px 2px}
.fx .d{text-align:center;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer}
button.on{background:var(--pill);color:var(--pillt);border-color:#a9bff0;font-weight:600}
button:disabled{opacity:.5}
.note{color:var(--mut);font-size:12px;margin-top:8px}
.rh{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center;margin:14px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--tx)}
.rh:first-child{margin-top:0}
.by{font-size:12px;color:var(--mut);margin-left:8px;flex:1}
.tmin{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px;padding:0 0 6px;border-bottom:1px solid var(--bd)}
.tmin input{padding:4px 6px;font-size:13px}
.adminonly{display:none}
body.admin .adminonly{display:block}
body.admin div.row.adminonly{display:flex}
.adm{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#202124;color:#fff;border-radius:12px;padding:10px 12px;margin:8px 0 4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.adm[hidden]{display:none}
.adm .tx{flex:1;min-width:160px}
.adm button.go{background:#8ab4f8;color:#202124;border-color:#8ab4f8;font-weight:700}
.login{display:grid;gap:8px;max-width:320px}
.login[hidden]{display:none}
.login input{width:100%}
.err{color:var(--L);font-size:12px;min-height:16px}
.foot{text-align:center;margin-top:8px}
.foot button{background:none;border:0;color:var(--mut);font-size:12px;text-decoration:underline}
body.admin .foot .li{display:none}
</style>
</head>
<body>
<main>
<div class="adm" id="adm" hidden>
  <span class="tx"><b>Admin mode.</b> Viewers see changes after you publish. <span id="msg"></span></span>
  <button class="go" id="pub">Publish results</button>
  <button id="out">Sign out</button>
</div>

<header class="hd" id="hd">
  <img class="logo" src="logo.png" alt="DLS Champions League" width="720" height="480">
  <h1 class="sr">DLS Champions League</h1>
  <div class="sub" id="sub"></div>
</header>
<nav class="chips" id="chips" aria-label="League sections">
  <a href="#overview" data-v="overview">Overview</a>
  <a href="#matches" data-v="matches">Matches</a>
  <a href="#table" data-v="table">Table</a>
</nav>

<section id="view"></section>
<div class="tz">All times are in East Africa Time</div>

<div class="card adminonly">
<h2>Enter results</h2>
<div class="row adminonly" style="margin-bottom:8px">
<button id="l1" class="on">Single round</button><button id="l2">Home and away</button>
</div>
<div id="fx"></div>
<div class="note adminonly">Set the date for each matchday and a kick-off time per match, then type the scores. Leave scores blank if not played.</div>
</div>

<div class="card adminonly">
<h2>Teams</h2>
<div class="names" id="names"></div>
<div class="row" style="margin-top:12px"><button id="rst">Clear all results</button></div>
</div>

<div class="card login" id="login" hidden>
<h2>Admin sign in</h2>
<input id="em" type="email" autocomplete="username" placeholder="Email">
<input id="pw" type="password" autocomplete="current-password" placeholder="Password">
<div class="row"><button class="on" id="si">Sign in</button><button id="sc">Cancel</button></div>
<div class="err" id="err"></div>
</div>

<div class="foot"><button class="li" id="lo">Admin sign in</button></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ====== 1. PASTE YOUR FIREBASE WEB CONFIG HERE ====== */
const firebaseConfig = {
  apiKey: "AIzaSyC3RkVzUA47QkCosYEA8PZ5UpI029HzqbE",
  authDomain: "league-7b3c4.firebaseapp.com",
  projectId: "league-7b3c4",
  storageBucket: "league-7b3c4.firebasestorage.app",
  messagingSenderId: "536896512335",
  appId: "1:536896512335:web:34692887fdd8c0abf4e53a"
};
/* ==================================================== */

var app = initializeApp(firebaseConfig);
var db = getFirestore(app);
var auth = getAuth(app);
var ref = doc(db, "league", "main");

var DEFAULT = {names:["Team 1","Team 2","Team 3","Team 4","Team 5","Team 6","Team 7"],legs:1,res:{},dates:{},times:{}};
var S = JSON.parse(JSON.stringify(DEFAULT));
var admin = false, unsaved = false;
var msg = document.getElementById("msg"), pub = document.getElementById("pub");
var cur = {v:"overview"}, mf = null, navCount = 0;
var PAL = ["#c5221f","#1a73e8","#188038","#e8710a","#8430ce","#129eaf","#d01884"];
var CHEV = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M9 5l7 7-7 7'/></svg>";
var BACK = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M15 5l-7 7 7 7'/></svg>";

function load(o){
  if(!o || !o.names || o.names.length !== 7) return;
  S = o; S.res = S.res || {}; S.dates = S.dates || {}; S.times = S.times || {}; S.legs = S.legs === 2 ? 2 : 1;
}
function nm(i){return (S.names[i]||"").trim()||("Team "+(i+1))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function abbr(n){var w=n.trim().split(/\s+/).filter(Boolean),s=w.length>1?w.map(function(x){return x.charAt(0)}).join(""):n.replace(/[^A-Za-z0-9]/g,"");return (s||"?").slice(0,3).toUpperCase()}
function badge(i){return "<i class='bd' style='background:"+PAL[i%7]+"'>"+esc(abbr(nm(i)))+"</i>"}
function ord(n){var s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}

/* ---------- fixtures and standings (unchanged logic) ---------- */
function rounds(){var arr=[0,1,2,3,4,5,6,7],base=[],r,i,l,out=[];
for(r=0;r<7;r++){var ms=[];for(i=0;i<4;i++){if(arr[i]!==7&&arr[7-i]!==7)ms.push([arr[i],arr[7-i]])}base.push(ms);arr=[arr[0],arr[7]].concat(arr.slice(1,7))}
for(l=1;l<=S.legs;l++)base.forEach(function(ms){out.push(ms.map(function(p){var lo=Math.min(p[0],p[1]),hi=Math.max(p[0],p[1]);return l===1?{k:lo+"-"+hi+"-1",h:lo,a:hi}:{k:lo+"-"+hi+"-2",h:hi,a:lo}}))});
return out}
function fixtures(){return [].concat.apply([],rounds())}
function fxList(){var out=[];rounds().forEach(function(ms,ri){ms.forEach(function(m){out.push({k:m.k,h:m.h,a:m.a,ri:ri})})});return out}
function bye(ms){var inr={},q;ms.forEach(function(m){inr[m.h]=1;inr[m.a]=1});for(q=0;q<7;q++)if(!inr[q])return q;return -1}
function played(k){var r=S.res[k];return r&&r[0]!==""&&r[1]!==""&&r[0]!=null&&r[1]!=null&&!isNaN(+r[0])&&!isNaN(+r[1])}
function isPl(m){return played(m.k)}
function isUp(m){return !played(m.k)}
function table(){
var t=[],i;for(i=0;i<7;i++)t.push({i:i,p:0,w:0,d:0,l:0,gf:0,ga:0,f:[]});
fixtures().forEach(function(m){if(!played(m.k))return;var r=S.res[m.k],h=+r[0],a=+r[1];
var H=t[m.h],A=t[m.a];H.f.push(h>a?"W":h<a?"L":"D");A.f.push(a>h?"W":a<h?"L":"D");
H.p++;A.p++;H.gf+=h;H.ga+=a;A.gf+=a;A.ga+=h;
if(h>a){H.w++;A.l++}else if(a>h){A.w++;H.l++}else{H.d++;A.d++}});
t.forEach(function(x){x.gd=x.gf-x.ga;x.pts=x.w*3+x.d});
t.sort(function(a,b){return b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||nm(a.i).localeCompare(nm(b.i))});
return t}
function curMd(){var rs=rounds(),i,j;for(i=0;i<rs.length;i++)for(j=0;j<rs[i].length;j++)if(!played(rs[i][j].k))return i+1;return rs.length}

/* ---------- public view building blocks ---------- */
function fmtDate(v){if(!v)return "Date to be confirmed";try{return new Date(v+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"})}catch(e){return v}}
function fmtShort(v){if(!v)return "";try{return new Date(v+"T00:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}catch(e){return v}}
function formHTML(a){return a.map(function(c){return "<b class='"+c+"'>"+c+"</b>"}).join("")}
function legend(){return "<div class='lg'><span><i style='background:#1a73e8'></i>Champions League</span><span><i style='background:#e8710a'></i>Europa League</span><span><i style='background:#d93025'></i>Relegation</span></div>"}

function card(m,f){
  var pl=played(m.k),r=S.res[m.k]||["",""],h=+r[0],a=+r[1],tv=S.times[m.k]||"",dv=fmtShort(S.dates[m.ri]||"");
  function side(t,sc,win,lose){
    return "<div class='sd"+(lose?" lo":"")+(f===t?" me":"")+"'><a class='tm' href='#team-"+t+"'>"+badge(t)+"<span class='nm'>"+esc(nm(t))+"</span></a><span class='sc'>"+(pl?sc:"")+"</span><span class='mk'>"+(win?"<s></s>":"")+"</span></div>";
  }
  var st=pl?"<b>FT</b><span>"+esc(dv)+"</span>":"<b>"+(tv?esc(tv):"TBC")+"</b><span>"+esc(dv||"Date TBC")+"</span>";
  if(f!=null){
    if(pl){var mine=f===m.h?h-a:a-h,c=mine>0?"W":mine<0?"L":"D";st+="<u class='"+c+"'>"+c+"</u>"}
    st+="<small>"+(f===m.h?"Home":"Away")+"</small>";
  }
  return "<div class='mc'><div class='ts'>"+side(m.h,h,pl&&h>a,pl&&h<a)+side(m.a,a,pl&&a>h,pl&&a<h)+"</div><div class='st'>"+st+"</div></div>";
}

function tblHTML(full){
  var T=table(),h="<div class='tw'><table class='lt'><thead><tr><th class='pos'>#</th><th class='tcol'>Team</th><th>P</th>"+(full?"<th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th>":"")+"<th>GD</th><th>Pts</th>"+(full?"<th>Form</th>":"")+"</tr></thead><tbody>";
  T.forEach(function(x,n){
    var z=n<2?"z1":n===2?"z2":n>=5?"z3":"";
    h+="<tr class='"+z+"' data-team='"+x.i+"'><td class='pos'>"+(n+1)+"</td><td class='tcol'><a href='#team-"+x.i+"'>"+badge(x.i)+"<span>"+esc(nm(x.i))+"</span></a></td><td>"+x.p+"</td>"+(full?"<td>"+x.w+"</td><td>"+x.d+"</td><td>"+x.l+"</td><td>"+x.gf+"</td><td>"+x.ga+"</td>":"")+"<td>"+(x.gd>0?"+":"")+x.gd+"</td><td class='p'>"+x.pts+"</td>"+(full?"<td class='fm'>"+formHTML(x.f.slice(-5))+"</td>":"")+"</tr>";
  });
  return h+"</tbody></table></div>";
}

/* ---------- the four views ---------- */
function vOverview(){
  var L=fxList(),P=L.filter(isPl).reverse(),U=L.filter(isUp);
  var nr=Math.min(P.length,U.length?2:3),nn=Math.min(U.length,3-nr);
  var list=P.slice(0,nr).concat(U.slice(0,nn));
  return "<h2 class='sec' style='margin-top:4px'>Matches</h2>"+list.map(function(m){return card(m)}).join("")+
    "<a class='more' href='#matches'>More matches "+CHEV+"</a>"+
    "<h2 class='sec'>Table</h2><div class='box'>"+tblHTML(false)+"</div>"+legend()+
    "<a class='more' href='#table'>Full table "+CHEV+"</a>";
}

function vMatches(){
  var L=fxList(),rs=rounds(),any=L.some(isPl);
  if(mf===null)mf=any?"res":"up";
  var h="<div class='flt'>"+[["res","Results"],["up","Upcoming"],["all","All"]].map(function(o){return "<button data-mf='"+o[0]+"' class='"+(mf===o[0]?"on":"")+"'>"+o[1]+"</button>"}).join("")+"</div>";
  var order=rs.map(function(_,i){return i});if(mf==="res")order.reverse();
  var out="";
  order.forEach(function(ri){
    var ms=L.filter(function(m){return m.ri===ri&&(mf==="all"||(mf==="res"?isPl(m):isUp(m)))});
    if(!ms.length)return;
    var dv=S.dates[ri]||"",b=bye(rs[ri]);
    out+="<div class='gh'><b>Matchday "+(ri+1)+"</b><span>"+esc(dv?fmtShort(dv):"Date TBC")+"</span></div>"+(b>=0?"<div class='rest'>Rest: "+esc(nm(b))+"</div>":"<div class='rest'></div>")+ms.map(function(m){return card(m)}).join("");
  });
  if(!out)out="<p class='empty'>"+(mf==="res"?"No results yet.":"No upcoming matches.")+"</p>";
  return h+out;
}

function vTable(){return "<div class='box'>"+tblHTML(true)+"</div>"+legend()+"<div class='note' style='margin:6px 2px 0'>Sorted by points, then goal difference, then goals scored. Tap a team to see its matches and form.</div>"}

function vTeam(i){
  var T=table(),pos=0,x=null;T.forEach(function(r,n){if(r.i===i){pos=n+1;x=r}});
  var L=fxList().filter(function(m){return m.h===i||m.a===i});
  var P=L.filter(isPl),U=L.filter(isUp);
  var fp=P.slice(-5).map(function(m){var r=S.res[m.k],h=+r[0],a=+r[1],home=m.h===i,own=home?h:a,opp=home?a:h;return {c:own>opp?"W":own<opp?"L":"D",s:own+"-"+opp,o:home?m.a:m.h}});
  var stats=[["P",x.p],["W",x.w],["D",x.d],["L",x.l],["GF",x.gf],["GA",x.ga],["GD",(x.gd>0?"+":"")+x.gd],["Pts",x.pts]];
  return "<button class='back' data-back='1'>"+BACK+"Back</button>"+
    "<div class='hero'>"+badge(i)+"<div><h1>"+esc(nm(i))+"</h1><div class='sub'>"+ord(pos)+" of 7 teams</div></div></div>"+
    "<div class='stats'>"+stats.map(function(s){return "<div><b>"+s[1]+"</b><span>"+s[0]+"</span></div>"}).join("")+"</div>"+
    "<h2 class='sec'>Form</h2>"+
    (fp.length?"<div class='form'>"+fp.map(function(f){return "<div class='fc'><b class='"+f.c+"'>"+f.c+"</b><span>"+f.s+"</span><small>"+esc(abbr(nm(f.o)))+"</small></div>"}).join("")+"</div><div class='fnote'>Last "+fp.length+" matches, latest on the right. Score shows this team first.</div>":"<p class='empty'>No matches played yet.</p>")+
    "<h2 class='sec'>Upcoming matches</h2>"+(U.length?U.map(function(m){return card(m,i)}).join(""):"<p class='empty'>No upcoming matches.</p>")+
    "<h2 class='sec'>Results</h2>"+(P.length?P.slice().reverse().map(function(m){return card(m,i)}).join(""):"<p class='empty'>No results yet.</p>");
}

function renderView(){
  var isT=cur.v==="team",v=document.getElementById("view");
  document.getElementById("hd").hidden=isT;
  document.getElementById("chips").hidden=isT;
  document.getElementById("sub").textContent="Matchday "+curMd()+" of "+rounds().length;
  Array.prototype.forEach.call(document.querySelectorAll("#chips a"),function(a){
    if(a.getAttribute("data-v")===cur.v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  v.innerHTML=cur.v==="matches"?vMatches():cur.v==="table"?vTable():isT?vTeam(cur.i):vOverview();
  document.title=(isT?nm(cur.i)+" | ":"")+"DLS Champions League";
}

/* ---------- routing: #overview  #matches  #table  #team-0 ... ---------- */
function route(){
  var h=location.hash.replace("#",""),m=/^team-([0-6])$/.exec(h);
  cur=m?{v:"team",i:+m[1]}:{v:(h==="matches"||h==="table")?h:"overview"};
  renderView();window.scrollTo(0,0);
}
window.addEventListener("hashchange",function(){navCount++;route()});
document.getElementById("view").addEventListener("click",function(e){
  if(e.target.closest("[data-back]")){if(navCount>0)history.back();else location.hash="table";return}
  var f=e.target.closest("[data-mf]");if(f){mf=f.getAttribute("data-mf");renderView();return}
  var tr=e.target.closest("tr[data-team]");if(tr&&!e.target.closest("a"))location.hash="team-"+tr.getAttribute("data-team");
});

/* ---------- admin editor ---------- */
function drawEditor(){
var el=document.getElementById("fx");
if(!admin){el.innerHTML="";return}
el.innerHTML=rounds().map(function(ms,ri){
var dv=S.dates[ri]||"";
var head="<div class='rh'><b>Matchday "+(ri+1)+"</b><span class='by'>Rest: "+esc(nm(bye(ms)))+"</span><input type='date' data-d='"+ri+"' value='"+dv+"'></div>";
return head+ms.map(function(m){var r=S.res[m.k]||["",""];var tv=S.times[m.k]||"";
return "<div class='fx'><span class='h'>"+esc(nm(m.h))+"</span><input inputmode='numeric' type='number' min='0' data-k='"+m.k+"' data-s='0' value='"+r[0]+"'><span class='d'>-</span><input inputmode='numeric' type='number' min='0' data-k='"+m.k+"' data-s='1' value='"+r[1]+"'><span>"+esc(nm(m.a))+"</span></div><div class='tmin'>Time <input type='time' data-t='"+m.k+"' value='"+tv+"'></div>"}).join("")}).join("");
}
function drawLegs(){document.getElementById("l1").className=S.legs===1?"on":"";document.getElementById("l2").className=S.legs===2?"on":""}
function drawNames(){
document.getElementById("names").innerHTML=S.names.map(function(n,i){return "<input data-n='"+i+"' maxlength='24' value=\""+esc(n)+"\" aria-label='Team "+(i+1)+" name'>"}).join("");
}
function drawAll(){drawNames();drawLegs();drawEditor();renderView()}
function dirty(){unsaved=true;msg.textContent="Unpublished changes."}

document.getElementById("fx").addEventListener("input",function(e){
if(!admin)return;
var d=e.target.getAttribute("data-d");if(d!=null){S.dates[d]=e.target.value;dirty();renderView();return}
var tt=e.target.getAttribute("data-t");if(tt!=null){S.times[tt]=e.target.value;dirty();renderView();return}
var k=e.target.getAttribute("data-k");if(!k)return;
var s=+e.target.getAttribute("data-s");var r=S.res[k]||["",""];r[s]=e.target.value;S.res[k]=r;dirty();renderView()});
document.getElementById("names").addEventListener("input",function(e){
var n=e.target.getAttribute("data-n");if(n==null||!admin)return;
S.names[+n]=e.target.value;dirty();renderView();drawEditor()});
document.getElementById("l1").onclick=function(){S.legs=1;dirty();drawLegs();drawEditor();renderView()};
document.getElementById("l2").onclick=function(){S.legs=2;dirty();drawLegs();drawEditor();renderView()};

var rb=document.getElementById("rst"),armed=false,tm;
rb.onclick=function(){
if(!armed){armed=true;rb.textContent="Tap again to confirm";tm=setTimeout(function(){armed=false;rb.textContent="Clear all results"},3000);return}
clearTimeout(tm);armed=false;rb.textContent="Clear all results";S.res={};dirty();drawEditor();renderView()};

/* Publish: save to Firestore. Viewers update live. */
pub.onclick = async function(){
  pub.disabled = true; msg.textContent = "Publishing...";
  try{
    await setDoc(ref, {data: JSON.stringify(S), updatedAt: serverTimestamp()});
    unsaved = false; msg.textContent = "Published.";
  }catch(e){
    msg.textContent = e && e.code === "permission-denied" ? "You do not have permission to publish." : "Could not publish. Check your connection and try again.";
  }
  pub.disabled = false;
};

/* Live updates for everyone. Admin's unpublished edits are never overwritten. */
onSnapshot(ref, function(snap){
  if(!snap.exists() || (admin && unsaved)) return;
  try{ load(JSON.parse(snap.data().data)); drawAll(); }catch(e){}
}, function(){});

/* Admin sign in */
var login = document.getElementById("login"), err = document.getElementById("err");
document.getElementById("lo").onclick = function(){login.hidden = false; document.getElementById("em").focus()};
document.getElementById("sc").onclick = function(){login.hidden = true; err.textContent = ""};
document.getElementById("si").onclick = async function(){
  err.textContent = "";
  try{
    await signInWithEmailAndPassword(auth, document.getElementById("em").value.trim(), document.getElementById("pw").value);
    document.getElementById("pw").value = ""; login.hidden = true;
  }catch(e){ err.textContent = "Wrong email or password." }
};
document.getElementById("out").onclick = function(){signOut(auth)};
onAuthStateChanged(auth, function(user){
  admin = !!user;
  document.body.classList.toggle("admin", admin);
  document.getElementById("adm").hidden = !admin;
  if(!admin){unsaved = false; msg.textContent = ""}
  drawAll();
});

route();
drawAll();
</script>
</body>
</html>
