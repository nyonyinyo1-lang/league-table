<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DLS Champions League</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="only light">
<style>
:root{--bg:#fff;--card:#f5f6f8;--tx:#202124;--mut:#5f6368;--dim:#70757a;--bd:#e3e5e8;--blue:#1a56c8;--pill:#e5ecfb;--pillt:#14357f;--chip:#f1f3f4;--in:#f1f3f4;--W:#188038;--D:#80868b;--L:#d93025;--gold:#ffd600;--raise:#eceef1;color-scheme:only light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:600px;margin:0 auto;padding:8px 16px 48px}
a:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* header and tabs */
.hd{padding:18px 2px 10px}
.hd[hidden],.chips[hidden]{display:none}
.hd h1{font-size:26px;font-weight:500;margin:0;line-height:1.2}
.logo{display:block;width:min(260px,70%);height:auto;margin:0 auto 4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd{text-align:center}
.sub{font-size:12px;color:var(--mut);margin-top:6px;font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;padding:10px 16px;border-radius:12px;background:var(--chip);color:var(--tx);text-decoration:none;font-size:14px;border:1px solid transparent}
.chips a[aria-current=page]{border-color:#5f6368;background:var(--raise);font-weight:500}
h2.sec{font-size:20px;font-weight:500;margin:20px 0 14px}
.tz{font-size:11px;color:var(--mut);padding:4px 2px 14px;border-bottom:1px solid var(--bd);margin-bottom:8px}

/* match card */
.mc{display:grid;grid-template-columns:1fr 104px;align-items:center;background:var(--card);border-radius:20px;padding:14px 16px 14px 18px;margin-bottom:12px}
.pg{margin-bottom:12px}.pg .mc{margin-bottom:6px}
.agg{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 18px;font-size:13px;color:var(--mut)}
.agg b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ts{display:grid;gap:14px;padding-right:12px;min-width:0}
.sd{display:grid;grid-template-columns:1fr auto 12px;align-items:center;gap:8px}
.tm{display:flex;align-items:center;gap:12px;min-width:0;color:inherit;text-decoration:none}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{min-width:14px;text-align:right;font-variant-numeric:tabular-nums}
.sd.lo{color:var(--dim)}
.sd.me .nm{font-weight:600}
.mk s{display:block;width:0;height:0;border-style:solid;border-width:4px 6px 4px 0;border-color:transparent var(--tx) transparent transparent}
.st{border-left:1px solid var(--bd);padding-left:12px;margin:2px 0;align-self:stretch;display:grid;gap:2px;justify-items:center;align-content:center;text-align:center;font-size:12px;color:var(--mut)}
.st b{font-weight:500;color:var(--tx)}
.st small{font-size:11px}
.st u{text-decoration:none;font-weight:600;width:22px;height:22px;line-height:22px;border-radius:50%;color:#fff;margin-top:4px}
.st u.W,.fm b.W,.fc b.W{background:var(--W)}
.st u.D,.fm b.D,.fc b.D{background:var(--D)}
.st u.L,.fm b.L,.fc b.L{background:var(--L)}
.bd{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font-size:9px;font-weight:700;font-style:normal;flex:none}
.more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:var(--pill);color:var(--pillt);border-radius:24px;padding:14px;text-decoration:none;font-weight:500;margin-top:4px}
.more svg{width:16px;height:16px}
.empty{color:var(--mut);font-size:14px;margin:4px 2px 12px}

/* standings */
.box{background:var(--card);border-radius:20px;padding:6px 12px 4px;margin-bottom:12px;--rb:var(--card)}
.tw{overflow-x:auto}
table.lt{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.lt th,.lt td{padding:12px 8px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--bd);background:var(--rb,var(--bg))}
.lt th{font-size:12px;font-weight:500;color:var(--mut);padding:10px 8px}
.lt tbody tr:last-child td{border-bottom:0}
.lt tr[data-team]{cursor:pointer}
.lt .pos{position:sticky;left:0;z-index:1;width:36px;min-width:36px;border-left:4px solid transparent;font-weight:500}
.lt .tcol{position:sticky;left:36px;z-index:1;text-align:left;padding-left:4px}
.lt td.tcol a{display:flex;align-items:center;gap:10px;color:var(--tx);text-decoration:none;font-weight:500}
.lt td.tcol span{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.lt th.pt{font-weight:700;color:var(--tx)}
.lt td.p{font-weight:700}
.ptb{display:inline-block;min-width:26px;height:26px;line-height:26px;padding:0 6px;box-sizing:border-box;border-radius:13px;background:#000;color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
.fm{white-space:nowrap}
.fm b{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;font-size:11px;font-weight:600;color:#fff;margin:0 2px;text-align:center}

/* matches tab */
.flt{display:flex;gap:8px;margin:2px 0 6px}
.flt button{border:1px solid transparent;background:var(--chip);border-radius:12px;padding:8px 14px;font-size:14px}
.flt button.on{border-color:#5f6368;background:var(--raise);font-weight:500}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:22px 2px 4px;font-size:15px}
.gh b{font-weight:500}
.gh span{font-size:12px;color:var(--mut)}
.rest{font-size:12px;color:var(--mut);margin:0 2px 10px}

/* team page */
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--tx);padding:14px 4px 8px;font-size:14px;font-weight:500}
.back svg{width:18px;height:18px}
.hero{display:flex;align-items:center;gap:14px;padding:6px 2px 16px}
.hero .bd{width:60px;height:60px;font-size:18px}
.hero h1{font-size:26px;font-weight:500;margin:0;line-height:1.2;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(4,1fr);row-gap:14px;background:var(--card);border-radius:20px;padding:14px 8px;text-align:center}
.stats b{display:block;font-size:18px;font-weight:500}
.stats span{font-size:11px;color:var(--mut)}
.form{background:var(--card);border-radius:20px;padding:16px;display:flex;gap:6px}
.fc{flex:0 0 calc(20% - 5px);display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--mut);min-width:0}
.fc b{width:34px;height:34px;line-height:34px;border-radius:50%;color:#fff;font-size:14px;font-weight:600;text-align:center}
.fc span{color:var(--tx);font-size:12px;font-variant-numeric:tabular-nums}
.fc small{font-size:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.fnote{font-size:12px;color:var(--mut);margin:8px 2px 0}

/* admin */
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;margin:18px 0}
.card h2{font-size:16px;font-weight:500;margin:0 0 10px}
.names{display:grid;grid-template-columns:1fr;gap:8px}
.trow{display:flex;gap:8px;align-items:center}
.trow input{flex:1;min-width:0}
button.del{color:var(--L);border-color:#f0c4c0;background:#fff;flex:none}
button.del.arm{background:var(--L);color:#fff;border-color:var(--L);font-weight:600}
input{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:8px}
.fx{display:grid;grid-template-columns:1fr 46px 12px 46px 1fr;gap:6px;align-items:center;padding:6px 0}
.fx span.h{text-align:right}
.fx span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx input{width:46px;text-align:center;padding:8px 2px}
.fx .d{text-align:center;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer}
button.on{background:var(--pill);color:var(--pillt);border-color:#a9bff0;font-weight:600}
button:disabled{opacity:.5}
.note{color:var(--mut);font-size:12px;margin-top:8px}
.rh{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center;margin:14px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--tx)}
.rh:first-child{margin-top:0}
.by{font-size:12px;color:var(--mut);margin-left:8px;flex:1}
.tmin{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px;padding:0 0 6px;border-bottom:1px solid var(--bd)}
.tmin input{padding:4px 6px;font-size:13px}
.adminonly{display:none}
body.admin .adminonly{display:block}
body.admin div.row.adminonly{display:flex}
.adm{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#202124;color:#fff;border-radius:12px;padding:10px 12px;margin:8px 0 4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.adm[hidden]{display:none}
.adm .tx{flex:1;min-width:160px}
.adm button.go{background:#8ab4f8;color:#202124;border-color:#8ab4f8;font-weight:700}
.login{display:grid;gap:8px;max-width:320px}
.login[hidden]{display:none}
.login input{width:100%}
.err{color:var(--L);font-size:12px;min-height:16px}
.foot{text-align:center;margin-top:8px}
.foot button{background:none;border:0;color:var(--mut);font-size:12px;text-decoration:underline}
body.admin .foot .li{display:none}
/* free-to-play predictions: sportsbook look, light */
.ptop{display:flex;justify-content:space-between;align-items:center;padding:4px 0 12px}
.ptop b{font-size:24px;font-weight:700}
.ppts{background:#ffd600;color:#000;font-weight:700;border-radius:12px;padding:10px 16px}
.pnote{font-size:12px;color:var(--mut);padding:0 0 10px}
.pmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);padding:0 0 12px}
.pmeta button{background:none;border:0;color:#188038;padding:0;text-decoration:underline;font-size:13px}
.bhd{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px;padding:8px 0 6px;border-top:1px solid var(--bd)}
.bhd .c,.bro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:54%;min-width:190px;flex:none;text-align:center}
.br{padding:14px 0 4px;border-bottom:1px solid var(--bd)}
.br.pa{border-left:3px solid #ffd600;padding-left:10px}
.brh{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-bottom:8px;gap:8px}
.brb{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brt{flex:1;min-width:0;display:grid;gap:4px;font-size:17px;font-weight:500;line-height:1.25}
.pcl{font-size:13px;color:var(--mut);padding:8px 0}
.brm{display:block;margin-left:auto;background:none;border:0;color:#188038;font-size:14px;font-weight:500;padding:12px 0 10px}
.og{display:grid;gap:8px;grid-template-columns:repeat(var(--c,3),1fr)}
.ob{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;padding:6px 4px;border-radius:22px;border:0;background:var(--raise);color:var(--tx);min-width:0;font:inherit}
.ob span{font-size:12px;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ob b{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--tx)}
.ob.m{height:52px;border-radius:26px}.ob.m span{display:none}
.ob.on{background:#ffd600}.ob.on b,.ob.on span{color:#000}
.ob:disabled{opacity:.35}
.mx{padding:2px 0 10px}.mk2{margin-top:12px}.mk2 h4{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--mut)}
.pdone{font-size:12px;color:var(--mut);padding:14px 0 0}
.bet{background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:8px;font-size:13px}
.bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bs{font-size:11px;font-weight:600;color:#fff;border-radius:10px;padding:2px 9px;background:#80868b}
.bs.won{background:#188038}.bs.lost{background:#d93025}
.bsl{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--bd)}
.bsl i{font-style:normal;color:var(--mut);white-space:nowrap}
.bft{display:flex;justify-content:space-between;border-top:1px solid var(--bd);padding-top:6px;color:var(--mut)}
.lbr{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:6px}
.lbr.me{outline:2px solid #ffd600}.lbr .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbr .r{width:22px;color:var(--mut)}
#pslip{position:fixed;left:0;right:0;bottom:0;z-index:30}
.pst{background:#ffd600;color:#000;display:flex;justify-content:space-between;padding:8px 16px;font-size:14px;font-weight:500}
.pnav{background:#fff;border-top:1px solid #e3e5e8;display:grid;grid-template-columns:1fr 1fr 92px 1fr 1fr;align-items:end;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));position:relative}
.pnav>button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;padding:2px 0;font:inherit;font-size:12px}
.pnav>button.on{color:#188038}.pnav svg{width:26px;height:26px}
.pnav>button.pcount{width:72px;height:72px;border-radius:50%;background:#ffd600;color:#000;font-size:22px;font-weight:600;margin:-36px auto 0;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.sheet{background:#fff;color:#202124;max-height:58vh;overflow:auto;padding:14px 16px;border-radius:18px 18px 0 0;font-size:13px;box-shadow:0 -4px 18px rgba(0,0,0,.18)}
.ssel{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.ssel small{display:block;color:var(--mut)}.ssel button{background:none;border:0;color:var(--mut);font-size:18px;padding:0 4px}
.smode{display:flex;gap:8px;margin:10px 0}
.smode button{flex:1;background:var(--raise);color:var(--tx);border:0;border-radius:10px;padding:8px}.smode button.on{background:#ffd600;color:#000;font-weight:600}.smode button:disabled{opacity:.4}
.sst{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sst input{width:90px}
.sst button{background:var(--raise);color:var(--tx);border:0;border-radius:10px;padding:8px 10px}
#psum{margin:10px 0;color:var(--tx)}
.sgo{width:100%;background:#ffd600;color:#000;border:0;border-radius:12px;padding:13px;font-weight:700}
.smsg{margin-top:8px;color:#b06000;min-height:16px}

/* my bets: compact rows + details popup */
.bt{display:grid;gap:6px;width:100%;text-align:left;background:var(--card);color:var(--tx);border:0;border-radius:14px;padding:15px 18px;margin-bottom:10px}
.bt:active{background:var(--raise)}
.bt .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bt .c{font-size:17px;font-weight:700;letter-spacing:.3px}
.bt .a{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.bt .d{font-size:14px;color:var(--mut)}
.bt .w{font-size:13px;color:var(--mut)}.bt .w b{color:var(--tx);font-weight:600}
.bt .sx{font-size:14px;font-weight:500}
.sx.open{color:#b06000}.sx.won{color:#188038}.sx.lost{color:var(--L)}.sx.void{color:var(--mut)}
#bmodal{position:fixed;inset:0;z-index:60;background:rgba(32,33,36,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#bmodal[hidden]{display:none}
.bmc{width:100%;max-width:420px;max-height:84vh;overflow:auto;background:#fff;color:var(--tx);border-radius:20px;padding:18px 18px 16px;box-shadow:0 10px 40px rgba(0,0,0,.25);border:1px solid var(--bd)}
.bmh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.bmh b{font-size:20px;letter-spacing:.3px}
.bmx{background:none;border:0;color:var(--mut);font-size:26px;line-height:1;padding:0 4px}
.bmm{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);padding-bottom:10px}
.bms{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--bd);font-size:14px}
.bms small{display:block;color:var(--mut);font-size:12px;margin-bottom:2px}
.bms i{font-style:normal;white-space:nowrap;text-align:right}.bms i b{display:block;color:var(--pillt);font-weight:600}
.bmt{border-top:1px solid var(--bd);padding-top:8px;margin-top:2px}
.bmt div{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;color:var(--mut)}
.bmt div b{color:var(--tx);font-weight:600}.bmt div.big b{color:var(--tx);font-size:17px}
</style>
</head>
<body>
<main>
<div class="adm" id="adm" hidden>
  <span class="tx"><b>Admin mode.</b> Viewers see changes after you publish. <span id="msg"></span></span>
  <button class="go" id="pub">Publish results</button>
  <button id="out">Sign out</button>
</div>

<header class="hd" id="hd">
  <img class="logo" src="logo.png" alt="DLS Champions League" width="720" height="480">
  <h1 class="sr">DLS Champions League</h1>
  <div class="sub" id="sub"></div>
</header>
<nav class="chips" id="chips" aria-label="League sections">
  <a href="#overview" data-v="overview">Overview</a>
  <a href="#matches" data-v="matches">Matches</a>
  <a href="#table" data-v="table">Table</a>
  <a href="#predict" data-v="predict">Predict</a>
</nav>

<section id="view"></section>
<div class="tz">All times are in East Africa Time</div>

<div class="card adminonly">
<h2>Enter results</h2>
<div class="row adminonly" style="margin-bottom:8px">
<button id="l1" class="on">Single round</button><button id="l2">Home and away</button>
</div>
<div id="fx"></div>
<div class="note adminonly">Set the date for each matchday and a kick-off time per match, then type the scores. Leave scores blank if not played.</div>
</div>

<div class="card adminonly">
<h2>Teams</h2>
<div class="names" id="names"></div>
<div class="row" style="margin-top:12px"><input id="newt" maxlength="24" placeholder="New team name" aria-label="New team name" style="flex:1;min-width:140px"><button class="on" id="addt">Add team</button></div>
<div class="note" id="tnote"></div>
<div class="row" style="margin-top:12px"><button id="rst">Reset scores, dates and times</button></div>
</div>

<div class="card login" id="login" hidden>
<h2>Admin sign in</h2>
<input id="em" type="email" autocomplete="username" placeholder="Email">
<input id="pw" type="password" autocomplete="current-password" placeholder="Password">
<div class="row"><button class="on" id="si">Sign in</button><button id="sc">Cancel</button></div>
<div class="err" id="err"></div>
</div>

<div id="bmodal" hidden role="dialog" aria-modal="true" aria-label="Bet details"></div>
<div id="pslip" hidden></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, collection, onSnapshot, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ====== 1. PASTE YOUR FIREBASE WEB CONFIG HERE ====== */
const firebaseConfig = {
  apiKey: "AIzaSyC3RkVzUA47QkCosYEA8PZ5UpI029HzqbE",
  authDomain: "league-7b3c4.firebaseapp.com",
  projectId: "league-7b3c4",
  storageBucket: "league-7b3c4.firebasestorage.app",
  messagingSenderId: "536896512335",
  appId: "1:536896512335:web:34692887fdd8c0abf4e53a"
};
/* ==================================================== */

var app = initializeApp(firebaseConfig);
var db = getFirestore(app);
var auth = getAuth(app);
var ref = doc(db, "league", "main");

var MAXT = 20, MINT = 2;
var DEFAULT = {names:["Team 1","Team 2","Team 3","Team 4","Team 5","Team 6","Team 7"],ids:[0,1,2,3,4,5,6],nid:7,legs:1,res:{},dates:{},times:{}};
var S = JSON.parse(JSON.stringify(DEFAULT));

for(i=0;i<=NG;i++)for(j=0;j<=NG;j++){g[i][j]=ph[i]*pa[j];s+=g[i][j]}
for(i=0;i<=NG;i++)for(j=0;j<=NG;j++)g[i][j]/=s;return g}
function gridC(m){return _gc[m.k]||(_gc[m.k]=grid(m))}
function prob(g,f){var i,j,w=0,v=0,x;for(i=0;i<=NG;i++)for(j=0;j<=NG;j++){x=f(i,j);if(x===1)w+=g[i][j];else if(x===-1)v+=g[i][j]}return v<1?w/(1-v):0}
function pairProb(g1,g2,f){var i,j,k,l,w=0,a,b;for(i=0;i<=NG;i++)for(j=0;j<=NG;j++){a=g1[i][j];if(a<1e-9)continue;for(k=0;k<=NG;k++)for(l=0;l<=NG;l++){b=g2[k][l];if(b>1e-9)w+=a*b*f(i,j,l,k)}}return w}
function odd(p){if(!(p>0.0005))return 0;return Math.round(clamp(1/(p*MARGIN),1.01,500)*100)/100}
function FX(){if(_fx)return _fx;var o={};fxList().forEach(function(m){o[m.k]=m});return _fx=o}
function closeAt(m){var d=S.dates[m.ri];if(!d)return Infinity;var x=new Date(d+"T"+(S.times[m.k]||"00:00")+":00+03:00").getTime();return isNaN(x)?Infinity:x}
function isOpen(m){return !played(m.k)&&Date.now()<closeAt(m)}
function pOpen(m1,m2){return !played(m2.k)&&(played(m1.k)||isOpen(m1))&&isOpen(m2)}
function lab(s,h,a){return s.replace(/\{H\}|\{L\}/g,h).replace(/\{A\}|\{U\}/g,a)}
function fnd(mk,oid){var i;for(i=0;i<mk.o.length;i++)if(mk.o[i][0]===oid)return mk.o[i];return null}
function info(K,mid,oid){
var F=FX(),pair=K.charAt(0)==="P",m,m1,m2,mk,o,p,hn,an,open,pk;
if(pair){pk=K.slice(2);m1=F[pk+"-1"];m2=F[pk+"-2"];if(!m1||!m2)return null;mk=PCATM[mid];if(!mk)return null;o=fnd(mk,oid);if(!o)return null;hn=nm(m1.h);an=nm(m1.a);
p=pairProb(gridC(m1),gridC(m2),o[2]);open=pOpen(m1,m2)}
else{m=F[K];if(!m)return null;mk=CATM[mid];if(!mk)return null;o=fnd(mk,oid);if(!o)return null;hn=nm(m.h);an=nm(m.a);p=prob(gridC(m),o[2]);open=isOpen(m)}
return {odds:odd(p),open:open,pn:lab(o[1],hn,an),mkn:lab(mk.n,hn,an),mt:hn+" v "+an+(pair?" (aggregate)":S.legs===2?" (leg "+m.lg+")":"")}}

/* settlement is always worked out from the current results */
function selRes(s){var F=FX(),x,r,r1,r2,mk,o,pk;
if(s.K.charAt(0)==="P"){pk=s.K.slice(2);if(!F[pk+"-1"]||!F[pk+"-2"])return "V";if(!played(pk+"-1")||!played(pk+"-2"))return null;
r1=S.res[pk+"-1"];r2=S.res[pk+"-2"];o=fnd(PCATM[s.mid],s.oid);x=o[2](+r1[0],+r1[1],+r2[1],+r2[0])}
else{if(!F[s.K])return "V";if(!played(s.K))return null;r=S.res[s.K];o=fnd(CATM[s.mid],s.oid);x=o[2](+r[0],+r[1])}
return x===1?"W":x===-1?"V":"L"}
function betState(b){var rs=b.sels.map(selRes),i,pr=1,won=0;
if(rs.indexOf("L")>=0)return {st:"lost",ret:0,rs:rs};
if(rs.indexOf(null)>=0)return {st:"open",ret:0,rs:rs};
for(i=0;i<rs.length;i++)if(rs[i]==="W"){pr*=b.sels[i].odds;won++}
return won?{st:"won",ret:Math.round(b.stake*pr),rs:rs}:{st:"void",ret:b.stake,rs:rs}}
function pBal(){var st=0,ret=0,op=0;P.bets.forEach(function(b){var s=betState(b);st+=b.stake;if(s.st==="open")op+=b.stake;else ret+=s.ret});var free=START-st+ret;return {free:free,open:op,pts:free+op}}

function pkOf(K){return K.charAt(0)==="P"?K.slice(2):K.replace(/-\d$/,"")}
function clash(a,b){return a.K===b.K||((a.K.charAt(0)==="P")!==(b.K.charAt(0)==="P")&&pkOf(a.K)===pkOf(b.K))}
function togSel(K,mid,oid){var i,n={K:K,mid:mid,oid:oid};

return {tot:tot,ret:Math.round(ret),pr:(acca||n===1)?pr:null}}

function resetDel(){Array.prototype.forEach.call(document.querySelectorAll("#names [data-del]"),function(b){b.textContent="Delete";b.classList.remove("arm")});delArm=null;clearTimeout(delTm)}
document.getElementById("names").addEventListener("click",function(e){
var b=e.target.closest("[data-del]");if(!b||!admin||b.disabled)return;
var id=+b.getAttribute("data-del");
if(delArm!==id){resetDel();delArm=id;b.textContent="Tap to confirm";b.classList.add("arm");delTm=setTimeout(resetDel,3000);return}
resetDel();removeTeam(id)});
function removeTeam(id){
var x=S.ids.indexOf(id);if(x<0||S.ids.length<=MINT)return;
S.ids.splice(x,1);S.names.splice(x,1);
[S.res,S.times].forEach(function(o){Object.keys(o).forEach(function(k){var p=k.split("-");if(+p[0]===id||+p[1]===id)delete o[k]})});
dirty();drawAll()}
function addTeam(){
if(!admin||S.ids.length>=MAXT)return;
var inp=document.getElementById("newt"),n=inp.value.trim()||("Team "+(S.ids.length+1));
S.ids.push(S.nid);S.nid++;S.names.push(n.slice(0,24));
inp.value="";dirty();drawAll()}
document.getElementById("addt").onclick=addTeam;
document.getElementById("newt").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();addTeam()}});
document.getElementById("l1").onclick=function(){S.legs=1;dirty();drawLegs();drawEditor();renderView()};
document.getElementById("l2").onclick=function(){S.legs=2;dirty();drawLegs();drawEditor();renderView()};

var rb=document.getElementById("rst"),armed=false,tm;
rb.onclick=function(){
if(!armed){armed=true;rb.textContent="Tap again to confirm";tm=setTimeout(function(){armed=false;rb.textContent="Reset scores, dates and times"},3000);return}
clearTimeout(tm);armed=false;rb.textContent="Reset scores, dates and times";S.res={};S.dates={};S.times={};dirty();drawEditor();renderView()};

/* Publish: save to Firestore. Viewers update live. */
pub.onclick = async function(){
  pub.disabled = true; msg.textContent = "Publishing...";
  try{
    await setDoc(ref, {data: JSON.stringify(S), updatedAt: serverTimestamp()});
    unsaved = false; msg.textContent = "Published.";
  }catch(e){
    msg.textContent = e && e.code === "permission-denied" ? "You do not have permission to publish." : "Could not publish. Check your connection and try again.";
  }
  pub.disabled = false;
};

/* Live updates for everyone. Admin's unpublished edits are never overwritten. */
onSnapshot(ref, function(snap){
  if(!snap.exists() || (admin && unsaved)) return;
  try{ load(JSON.parse(snap.data().data)); drawAll(); }catch(e){}
}, function(){});


/* predict page events */
document.getElementById("view").addEventListener("click",function(e){var t,a;
if((t=e.target.closest("[data-bet]"))){showBet(t.getAttribute("data-bet"));return}
if((t=e.target.closest("[data-sel]"))){a=t.getAttribute("data-sel").split("|");togSel(a[0],a[1],a[2]);px.msg="";renderView();return}
if((t=e.target.closest("[data-pmx]"))){a=t.getAttribute("data-pmx");px.open[a]=!px.open[a];renderView();return}
if((t=e.target.closest("[data-ptab]"))){px.tab=t.getAttribute("data-ptab");renderView();return}
if(e.target.closest("[data-pname]")){var nv=document.getElementById("pname").value.trim().slice(0,16);if(nv){P.name=nv;pSave();lastSync=null;renderView()}return}
if(e.target.closest("[data-pchg]")){P.name="";pSave();renderView();return}
if(e.target.closest("[data-preset]")){if(confirm("Reset your points and bets back to "+START+"?")){P.bets=[];slip=[];pSave();lastSync=null;renderView()}return}
});
document.getElementById("bmodal").addEventListener("click",function(e){if(e.target.id==="bmodal"||e.target.closest("[data-bclose]"))closeBet()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeBet()});
document.getElementById("pslip").addEventListener("click",function(e){var t;
if(e.target.closest("[data-bar]")){px.sheet=!px.sheet;drawSlip();return}
if((t=e.target.closest("[data-ptab]"))){px.tab=t.getAttribute("data-ptab");px.sheet=false;renderView();window.scrollTo(0,0);return}
if((t=e.target.closest("[data-go]"))){location.hash=t.getAttribute("data-go");return}
if((t=e.target.closest("[data-rm]"))){slip.splice(+t.getAttribute("data-rm"),1);px.msg="";renderView();return}
if((t=e.target.closest("[data-mode]"))){px.mode=t.getAttribute("data-mode");drawSlip();return}
if((t=e.target.closest("[data-chip]"))){px.stake=t.getAttribute("data-chip");drawSlip();return}
if(e.target.closest("[data-clear]")){slip=[];px.msg="";renderView();return}
if(e.target.closest("[data-place]")){place();drawSlip();return}
});
document.getElementById("pslip").addEventListener("input",function(e){if(e.target.id==="pstake"){px.stake=e.target.value;document.getElementById("psum").innerHTML=sumHTML();document.getElementById("pstrip").innerHTML=stripHTML()}});
try{onSnapshot(collection(db,"predict"),function(sn){var a=[];sn.forEach(function(d){var x=d.data();if(x&&typeof x.pts==="number"&&x.name)a.push({id:d.id,name:String(x.name).slice(0,16),pts:x.pts})});px.lb=a;px.lbErr=false;if(cur.v==="predict"&&px.tab==="lb")renderView()},function(){px.lbErr=true;px.lb=null})}catch(e){}

/* Admin sign in */
var login = document.getElementById("login"), err = document.getElementById("err");
/* Login is hidden: open the site with #admin-login on the end of the address to show it */
var ADMIN_HASH = "admin-login";
function checkAdminHash(){
  if(location.hash.replace("#","")===ADMIN_HASH && !admin){login.hidden = false; document.getElementById("em").focus()}
}
window.addEventListener("hashchange", checkAdminHash);
function closeLogin(){login.hidden = true; err.textContent = ""; if(location.hash.replace("#","")===ADMIN_HASH) history.replaceState(null,"",location.pathname+location.search)}
document.getElementById("sc").onclick = closeLogin;
document.getElementById("si").onclick = async function(){
  err.textContent = "";
  try{
    await signInWithEmailAndPassword(auth, document.getElementById("em").value.trim(), document.getElementById("pw").value);
    document.getElementById("pw").value = ""; closeLogin();
  }catch(e){ err.textContent = "Wrong email or password." }
};
document.getElementById("out").onclick = function(){signOut(auth)};
onAuthStateChanged(auth, function(user){
  admin = !!user;
  document.body.classList.toggle("admin", admin);
  document.getElementById("adm").hidden = !admin;
  if(!admin){unsaved = false; msg.textContent = ""}
  drawAll();
});

route();
checkAdminHash();
drawAll();
</script>
